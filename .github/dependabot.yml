# Monthly, grouped version updates: one pull request per ecosystem per month.
# The seven-day cooldown lets a compromised or yanked release surface before it is proposed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directories:
      - "/"
      - "/docs"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: nuget
    directories:
      - "/**/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      devcontainers:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
