# Monthly, grouped version updates: one pull request per ecosystem per month.
# The seven-day cooldown lets a compromised or yanked release surface before it is proposed.
version: 2

# @facioquo/indy-charts is on GitHub Packages, which needs a classic PAT with read:packages
# stored as a Dependabot secret; docs/.npmrc maps the @facioquo scope to this registry.
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }}

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directory: /docs
    registries:
      - npm-github
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: nuget
    directories:
      - "/**/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      devcontainers:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
