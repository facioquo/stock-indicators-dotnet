name: Copilot environment setup

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: 24

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # Above the sum of the step budgets: a job timeout ignores continue-on-error,
    # so a tighter one would hard-fail a job built never to block on setup.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}
          working-directory: docs
          install: false
        continue-on-error: true
        timeout-minutes: 5

      - name: Configure pnpm registry auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"
        continue-on-error: true

      - name: Install pnpm packages
        working-directory: docs
        run: pnpm install --frozen-lockfile
        continue-on-error: true
        timeout-minutes: 5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"
        continue-on-error: true

      - name: Restore packages
        run: dotnet restore
        continue-on-error: true
        timeout-minutes: 5

      - name: Install .NET tools
        run: dotnet tool restore
        continue-on-error: true
        timeout-minutes: 5

      # Global, not from the manifest: LSP clients spawn the bare binary from PATH.
      - name: Install C# language server
        run: dotnet tool install --global csharp-ls || dotnet tool update --global csharp-ls
        continue-on-error: true
        timeout-minutes: 5

      - name: Environment summary
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Copilot Environment Setup Complete 🚀"
            echo ""
            echo "### Development Tools"
            echo "- Repository: ${REPOSITORY}"
            echo "- .NET SDKs: $(dotnet --list-sdks | wc -l) versions available"
            echo "- .NET Tools: $(dotnet tool list | tail -n +3 | wc -l) installed"
            echo "- C# language server: $(csharp-ls --version 2>/dev/null || echo 'Not available')"
            echo "- Node.js: $(node --version 2>/dev/null || echo 'Not available')"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
