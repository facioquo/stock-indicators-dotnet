name: Copilot environment setup

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: 24

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          package_json_file: docs/package.json
        continue-on-error: true
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml
        continue-on-error: true

      - name: Configure pnpm registry auth
        run: pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install pnpm packages
        working-directory: docs
        run: pnpm install --frozen-lockfile
        continue-on-error: true
        timeout-minutes: 5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"
        continue-on-error: true

      - name: Restore packages
        run: dotnet restore
        continue-on-error: true
        timeout-minutes: 5

      - name: Install .NET tools
        run: dotnet tool restore
        continue-on-error: true
        timeout-minutes: 1

      # Installed globally, not from the manifest, because LSP clients spawn
      # the bare `csharp-ls` binary from PATH.
      - name: Install C# language server
        run: dotnet tool install --global csharp-ls || dotnet tool update --global csharp-ls
        continue-on-error: true
        timeout-minutes: 1

      - name: Environment summary
        run: |
          echo "## Copilot Environment Setup Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Development Tools" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- .NET SDKs: $(dotnet --list-sdks | wc -l) versions available" >> $GITHUB_STEP_SUMMARY
          echo "- .NET Tools: $(dotnet tool list | tail -n +3 | wc -l) installed" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js: $(node --version 2>/dev/null || echo 'Not available')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
