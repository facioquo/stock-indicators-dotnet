name: Website a11y

on:
  pull_request:
    paths:
      - docs/**
      - .github/workflows/test-website-a11y.yml
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !github.event.pull_request.draft }}
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}
          working-directory: docs
          install: false

      - name: Configure pnpm registry auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"

      - name: Install pnpm packages
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Builds the site, serves it, and runs axe-core (WCAG 2.1 A/AA) against
      # every page in the sitemap. ANALYTICS_ENABLED is intentionally unset so
      # the build carries no gtag snippet; the suite additionally blocks and
      # fails on any analytics request.
      #
      # The agent-features project shares that build to validate agent-facing
      # output: llms.txt identity, per-page Markdown, discovery files,
      # redirects, canonical metadata, Markdown negotiation, and WebMCP tools.
      - name: Test accessibility and agent features
        run: pnpm exec playwright test --project=a11y --project=analytics --project=agent-features

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: docs/playwright-report
          retention-days: 3
