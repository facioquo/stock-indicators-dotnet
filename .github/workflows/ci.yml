name: CI

# This is the primary CI workflow, sequenced to use
# a fail-fast approach in multiple stages.

on:
  push:
    branches:
      - "main"
      - "v[0-9]*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read # Required for checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: quick check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build core project
        run: >
          dotnet build src/Indicators.csproj
          --configuration Release
          --property:ContinuousIntegrationBuild=true
          -warnAsError

      - name: Lint markdown
        run: echo y | npx markdownlint-cli2

      - name: Audit StreamHub tests
        run: bash tools/scripts/audit-streamhub.sh

      - name: Build (package tests)
        run: >
          dotnet build tests/Library/Tests.Indicators.csproj
          --configuration Release
          --property:ContinuousIntegrationBuild=true
          -warnAsError

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quick-check
    if: ${{ !github.event.pull_request.draft }}

    permissions:
      contents: read
      checks: write # Required to post test results

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Test indicators
        run: >
          dotnet test tests/Library/Tests.Indicators.csproj
          --framework net11.0
          --configuration Release
          --settings tests/tests.unit.runsettings
          --timeout 10m
          --results-directory ./test-results/unit
          --verbosity normal
          --report-trx
          --coverage
          --coverage-output-format cobertura

      - name: Post unit test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Unit test results
          path: test-results/unit/**/*.trx
          reporter: dotnet-trx
          list-tests: failed
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-unit
          path: test-results/unit/*.cobertura.xml
          retention-days: 1
        continue-on-error: true

      - name: Publish coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: test-results/unit/*.cobertura.xml
        continue-on-error: true

  native-aot:
    name: NativeAOT smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quick-check
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.x"
          dotnet-quality: "ga"

      - name: Install NativeAOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish NativeAOT smoke app
        # TreatWarningsAsErrors in the project fails the publish on any IL2xxx/IL3xxx
        run: dotnet publish tests/Aot --configuration Release --output aot-out

      - name: Compare NativeAOT and JIT catalog runs
        # build first so jit.txt holds only the app's output, never build messages
        run: |
          dotnet build tests/Aot --configuration Release
          dotnet run --project tests/Aot --configuration Release --no-build > jit.txt
          ./aot-out/Tests.Aot > aot.txt
          diff jit.txt aot.txt

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ["lint-and-test", "test-regression", "native-aot"]
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build solution
        run: >
          dotnet build
          --configuration Release
          --property:ContinuousIntegrationBuild=true
          -warnAsError

      - name: Check .NET code formatting
        run: dotnet format --verify-no-changes --severity info --no-restore

  test-regression:
    name: regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quick-check
    if: ${{ !github.event.pull_request.draft }}

    permissions:
      contents: read
      checks: write # Required to post test results

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Test regression baselines
        run: >
          dotnet test tests/Library/Tests.Indicators.csproj
          --framework net11.0
          --configuration Release
          --settings tests/tests.regression.runsettings
          --timeout 15m
          --results-directory ./test-results/regression
          --verbosity normal
          --report-trx

      - name: Post regression test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Regression test results
          path: test-results/regression/**/*.trx
          reporter: dotnet-trx
          list-tests: failed
        continue-on-error: true
