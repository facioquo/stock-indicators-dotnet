name: CI

# This is the primary CI workflow, sequenced to use
# a fail-fast approach in multiple stages.

on:
  pull_request:
  push:
    branches:
      - "main"
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read # Required for checkout
  checks: write # Required for test results

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    runs-on: ubuntu-latest

    steps:

      - name: Merge protection check
        if: github.base_ref == 'main'
        run: |
          echo "::error title=Reverse merge prohibited::❌ Targeting 'main' from a maintenance branch is prohibited."
          exit 1

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build (package sources)
        run: >
          dotnet build src/Indicators.csproj
          --configuration Release
          --property:ContinuousIntegrationBuild=true
          -warnAsError

      - name: Lint .NET (core package only)
        run: >
          dotnet format src/Indicators.csproj
          --verify-no-changes
          --severity info
          --no-restore

      - name: Lint markdown
        run: echo y | npx markdownlint-cli2

      - name: Build (package tests)
        run: >
          dotnet build tests/indicators/Tests.Indicators.csproj
          --configuration Release
          --property:ContinuousIntegrationBuild=true
          -warnAsError

  lint-and-test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    needs: quick-check

    steps:

      - name: Merge protection check
        if: github.base_ref == 'main'
        run: |
          echo "::error title=Reverse merge prohibited::❌ Targeting 'main' from a maintenance branch is prohibited."
          exit 1

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Test indicators
        run: >
          dotnet test tests/indicators/Tests.Indicators.csproj
          --configuration Release
          --settings tests/tests.unit.runsettings
          --results-directory ./test-results/unit
          --verbosity normal
          --logger trx
          --collect:"XPlat Code Coverage"

      - name: Post unit test results
        uses: dorny/test-reporter@v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Unit test results
          path: test-results/unit/**/*.trx
          reporter: dotnet-trx
          list-tests: failed
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-unit
          path: test-results/unit/**/coverage.cobertura.xml
          retention-days: 1
        continue-on-error: true

      - name: Publish coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        if: success() && github.actor != 'dependabot[bot]'
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: test-results/unit/**/coverage.cobertura.xml
        continue-on-error: true

  lint-full:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Install .NET tools
        run: dotnet tool restore

      - name: Build solution
        # note: Roslynator cannot use cached bin/obj
        run: >
          dotnet build
          --configuration Release
          --property:ContinuousIntegrationBuild=true

      - name: Run Roslynator analysis
        run: >
          dotnet tool run roslynator analyze
          --properties TargetFramework=net10.0
          --severity-level info
          --verbosity normal
          ||
          echo "::warning title=Roslynator::analysis failed"
        continue-on-error: true

      - name: Check .NET code formatting
        run: dotnet format --verify-no-changes --severity info --no-restore

  gate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: ["quick-check", "lint-and-test", "lint-full"]
    if: ${{ !cancelled() && !github.event.pull_request.draft }}

    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job ended with '$result'."
              exit 1
            fi
          done
