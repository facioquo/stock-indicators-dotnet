name: Deploy website

on:
  workflow_dispatch:
  pull_request:
    paths:
      - docs/**
      - .github/workflows/deploy-website.yml

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'stockindicators.dev' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for proper Last Updated page dates

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          package_json_file: docs/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Configure pnpm registry auth
        run: pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm packages
        run: pnpm install --frozen-lockfile

      - name: Define tag
        id: tag
        run: echo "version=$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build site (production)
        if: github.ref == 'refs/heads/main'
        run: pnpm run docs:build
        env:
          ANALYTICS_ENABLED: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site (preview)
        if: github.ref != 'refs/heads/main'
        run: pnpm run docs:build
        env:
          ANALYTICS_ENABLED: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Do not pass `gitHubToken`: it makes wrangler-action open a second
          # GitHub Deployment on top of the one the job `environment` already
          # records, which shows up as a duplicate deployment on the PR.
          # `--branch` is explicit because `pull_request` checkouts are on a
          # detached HEAD, which would otherwise alias every PR to `head.`.
          command: >
            pages deploy docs/.vitepress/dist
            --project-name=stock-indicators-dotnet
            --branch=${{ github.head_ref || github.ref_name }}
