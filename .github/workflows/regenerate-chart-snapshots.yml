name: Regenerate chart snapshots

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

# The pull request is written with a facioquobo App token, so GITHUB_TOKEN only reads.
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancelling between regeneration and the pull request discards the whole run.
  cancel-in-progress: false

env:
  NODE_VERSION: 26

jobs:
  regenerate:
    name: Regenerate offline chart snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false # create-pull-request pushes with its own token

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}
          working-directory: docs
          install: false

      - name: Configure pnpm registry auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"

      - name: Install pnpm packages
        run: pnpm install --frozen-lockfile

      # Fails without touching the committed files when the API is unreachable,
      # so an outage leaves the last good snapshot in place.
      - name: Regenerate snapshot
        run: pnpm run snapshot:charts

      # Checked before the pull request opens, so a broken snapshot is never proposed.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test offline chart snapshot
        run: pnpm run test:offline

      # Minted after the tests, so its one-hour life covers only the pull request. With no
      # owner, the token covers this repository alone; these two permissions bound it.
      # A pull request opened as the App, unlike one opened with GITHUB_TOKEN, runs CI.
      - name: Mint facioquobo token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FACIOQUOBO_CLIENT_ID }}
          private-key: ${{ secrets.FACIOQUOBO_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve facioquobo commit identity
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "identity=${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.app-user.outputs.identity }}
          committer: ${{ steps.app-user.outputs.identity }}
          add-paths: docs/.vitepress/public/data/chart-api
          commit-message: "chore: Regenerate chart snapshots"
          title: "chore: Regenerate chart snapshots"
          body: |
            Regenerates the offline chart snapshot from the live chart API with `pnpm run snapshot:charts`.

            The snapshot is the data the docs charts fall back to when the API is unreachable. Review the diff for unexpected indicator changes.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: regenerate-chart-snapshots
          delete-branch: true
