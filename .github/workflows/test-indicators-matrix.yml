name: Test Indicators (matrix)

on:
  push:
    branches:
      - "main"
      - "v[0-9]*"
    paths:
      - src/**
  pull_request:
    paths:
      - .github/workflows/test-indicators-matrix.yml
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read # Required for checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Back-to-back merges must not cancel this: it runs on push only, so a
  # cancelled run leaves that commit with no Windows, macOS, or net8.0 coverage.
  cancel-in-progress: false

jobs:
  test:
    name: matrix validation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: ${{ !github.event.pull_request.draft }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        dotnet-version: ["8.0.x", "10.0.x"]

    env:
      TARGET_FRAMEWORK: >
        ${{ matrix.dotnet-version == '8.0.x' && 'net8.0' ||
            matrix.dotnet-version == '10.0.x' && 'net10.0' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET SDK (legacy sut)
        uses: actions/setup-dotnet@v6
        if: matrix.dotnet-version != '10.0.x'
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          dotnet-quality: "ga"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          dotnet-quality: "ga"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build library
        run: >
          dotnet build
          --configuration Release
          --property:ContinuousIntegrationBuild=true
          -warnAsError

      - name: Test indicators
        run: >
          dotnet test
          --configuration Release
          --settings tests/tests.unit.runsettings
          --property:TestFramework="${{ env.TARGET_FRAMEWORK }}"
          --no-build
