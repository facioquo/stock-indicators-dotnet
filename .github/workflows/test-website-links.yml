name: Website URLs

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          runtime: node@${{ env.NODE_VERSION }}
          cache-dependency-path: docs/pnpm-lock.yaml
          package-json-file: docs/package.json
          install: false

      - name: Configure pnpm registry auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"

      - name: Install pnpm packages
        run: pnpm install --frozen-lockfile

      # The script owns everything about the check — the build, the pinned
      # html-proofer version, the ignore lists and the retry policy — so CI
      # cannot drift from what contributors run locally. Ruby is on PATH from
      # the setup step above, so the script installs and uses the gem natively
      # rather than falling back to its container path.
      - name: Test for broken URLs
        run: pnpm run test:links
