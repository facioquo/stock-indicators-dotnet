# Actions are pinned to major version tags; zizmor defaults to hash pins, so
# unpinned-uses matches the policy here rather than being suppressed per file.
# pnpm/setup is the exception: its floating v2 tag still points at v2.0.2,
# which redownloads Node on every job.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
