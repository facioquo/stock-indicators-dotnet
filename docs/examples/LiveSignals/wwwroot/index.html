<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Live signal desk</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; background: #0f1115; color: #e6e6e6; display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
    #chart { min-height: 0; }
    aside { border-left: 1px solid #262a33; padding: 16px; overflow: auto; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .meta { color: #8a90a0; margin-bottom: 16px; }
    .sig { padding: 8px 0; border-top: 1px solid #262a33; }
    .BUY b { color: #26a69a; } .SELL b { color: #ef5350; } .weak { opacity: .6; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <aside>
    <h1 id="title">Connecting…</h1>
    <div class="meta" id="meta">EMA 21/55 crossover · ADX ≥ 20 filter · 1.5×ATR stop · evaluated on closed 1-minute candles</div>
    <div id="signals"></div>
  </aside>
  <script>
    const el = document.getElementById('chart');
    const chart = LightweightCharts.createChart(el, {
      autoSize: true,
      layout: { background: { color: '#0f1115' }, textColor: '#c8ccd6' },
      grid: { vertLines: { color: '#1b1f27' }, horzLines: { color: '#1b1f27' } },
      timeScale: { timeVisible: true, secondsVisible: false }
    });
    const candles = chart.addCandlestickSeries();
    const fast = chart.addLineSeries({ color: '#f5b942', lineWidth: 2, title: 'EMA21' });
    const slow = chart.addLineSeries({ color: '#7aa2f7', lineWidth: 2, title: 'EMA55' });

    let lastTime = 0;
    const line = (rows, key) => rows.filter(r => r[key] != null).map(r => ({ time: r.t, value: r[key] }));

    new EventSource('/stream').onmessage = (e) => {
      const p = JSON.parse(e.data);
      const bars = p.rows.map(r => ({ time: r.t, open: r.o, high: r.h, low: r.l, close: r.c }));
      if (p.full) {
        candles.setData(bars); fast.setData(line(p.rows, 'fast')); slow.setData(line(p.rows, 'slow'));
        lastTime = bars.length ? bars[bars.length - 1].time : 0;
      } else {
        // the chart only accepts updates to its newest point or later
        const fresh = (pts) => pts.filter(v => v.time >= lastTime);
        fresh(bars).forEach(b => candles.update(b));
        fresh(line(p.rows, 'fast')).forEach(v => fast.update(v));
        fresh(line(p.rows, 'slow')).forEach(v => slow.update(v));
        if (bars.length) lastTime = Math.max(lastTime, bars[bars.length - 1].time);
      }
      const last = p.rows[p.rows.length - 1];
      document.getElementById('title').textContent = `${p.symbol}  ${last ? last.c : ''}`;
      candles.setMarkers(p.signals.map(s => ({
        time: Math.floor(new Date(s.time.endsWith('Z') ? s.time : s.time + 'Z') / 1000),
        position: s.side === 'BUY' ? 'belowBar' : 'aboveBar',
        color: s.side === 'BUY' ? '#26a69a' : '#ef5350',
        shape: s.side === 'BUY' ? 'arrowUp' : 'arrowDown',
        text: s.side
      })));
      document.getElementById('signals').innerHTML = p.signals.slice().reverse().map(s =>
        `<div class="sig ${s.side} ${s.strong ? '' : 'weak'}"><b>${s.side}</b> ${s.price.toFixed(2)} · ${new Date(s.time.endsWith('Z') ? s.time : s.time + 'Z').toLocaleTimeString()}<br>${s.reason}</div>`
      ).join('') || 'No crossovers yet in this window.';
    };
  </script>
</body>
</html>
