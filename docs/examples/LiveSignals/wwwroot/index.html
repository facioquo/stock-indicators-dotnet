<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live signal desk</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js" integrity="sha384-OK7vELvjHdhUFi31JYioPIcRHTROLdcDa6ZsNWgvgLaKj+9JqhU0Ad8g4wz3CXjA" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; background: #0f1115; color: #e6e6e6; display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
    #chart { min-height: 0; }
    aside { border-left: 1px solid #262a33; padding: 16px; overflow: auto; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .meta { color: #8a90a0; margin-bottom: 16px; }
    .status { color: #c8ccd6; margin-bottom: 8px; }
    .sig { padding: 8px 0; border-top: 1px solid #262a33; }
    .BUY b { color: #26a69a; } .SELL b { color: #ef5350; } .weak { color: #a3a9b8; }
    @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; } aside { border-left: 0; border-top: 1px solid #262a33; } }
  </style>
</head>
<body>
  <div id="chart"></div>
  <aside>
    <h1 id="title">Connecting…</h1>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="meta" id="meta">EMA 21/55 crossover · ADX ≥ 20 filter · 1.5×ATR stop · evaluated on closed 1-minute candles</div>
    <div id="signals" aria-live="polite"></div>
  </aside>
  <script>
    const el = document.getElementById('chart');
    const chart = LightweightCharts.createChart(el, {
      autoSize: true,
      layout: { background: { color: '#0f1115' }, textColor: '#c8ccd6' },
      grid: { vertLines: { color: '#1b1f27' }, horzLines: { color: '#1b1f27' } },
      timeScale: { timeVisible: true, secondsVisible: false }
    });
    const candles = chart.addCandlestickSeries();
    const fast = chart.addLineSeries({ color: '#f5b942', lineWidth: 2, title: 'EMA21' });
    const slow = chart.addLineSeries({ color: '#7aa2f7', lineWidth: 2, title: 'EMA55' });

    let lastTime = 0;
    let zone;
    const fmt = (sec, opts) => new Intl.DateTimeFormat(undefined, { timeZone: zone, ...opts }).format(sec * 1000);
    const fmtFull = (sec) => fmt(sec, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    chart.applyOptions({
      localization: { timeFormatter: fmtFull },
      timeScale: {
        // tick types below 3 mark years, months, and days; 3 and up mark times
        tickMarkFormatter: (t, type) => fmt(t, type < 3 ? { month: 'short', day: 'numeric' } : { hour: '2-digit', minute: '2-digit' })
      }
    });
    const toSec = (iso) => Math.floor(new Date(iso.endsWith('Z') ? iso : iso + 'Z') / 1000);
    const line = (rows, key) => rows.filter(r => r[key] != null).map(r => ({ time: r.t, value: r[key] }));

    const source = new EventSource('/stream');
    // EventSource reconnects by itself; say so rather than leave stale data looking live
    source.onerror = () => { document.getElementById('status').textContent = 'Connection lost · retrying…'; };
    source.onmessage = (e) => {
      const p = JSON.parse(e.data);
      zone = p.tz || undefined;
      const bars = p.rows.map(r => ({ time: r.t, open: r.o, high: r.h, low: r.l, close: r.c }));
      if (p.full) {
        candles.setData(bars); fast.setData(line(p.rows, 'fast')); slow.setData(line(p.rows, 'slow'));
        lastTime = bars.length ? bars[bars.length - 1].time : 0;
      } else {
        // the chart only accepts updates to its newest point or later
        const fresh = (pts) => pts.filter(v => v.time >= lastTime);
        fresh(bars).forEach(b => candles.update(b));
        fresh(line(p.rows, 'fast')).forEach(v => fast.update(v));
        fresh(line(p.rows, 'slow')).forEach(v => slow.update(v));
        if (bars.length) lastTime = Math.max(lastTime, bars[bars.length - 1].time);
      }
      const last = p.rows[p.rows.length - 1];
      document.getElementById('title').textContent = `${p.symbol}  ${last ? last.c : ''}`;
      document.getElementById('status').textContent = p.status;
      candles.setMarkers(p.signals.map(s => ({
        time: toSec(s.time),
        position: s.side === 'BUY' ? 'belowBar' : 'aboveBar',
        color: s.side === 'BUY' ? '#26a69a' : '#ef5350',
        shape: s.side === 'BUY' ? 'arrowUp' : 'arrowDown',
        text: s.side
      })));
      document.getElementById('signals').innerHTML = p.signals.slice().reverse().map(s =>
        `<div class="sig ${s.side} ${s.strong ? '' : 'weak'}"><b>${s.side}</b> ${s.price.toFixed(2)} · ${fmtFull(toSec(s.time))}<br>${s.reason}</div>`
      ).join('') || 'No crossovers yet in this window.';
    };
  </script>
</body>
</html>
