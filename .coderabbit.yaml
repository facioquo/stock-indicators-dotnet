# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config docs: https://docs.coderabbit.ai/reference/configuration

# Repository-specific overrides for the inherited FacioQuo configuration.
inheritance: true

reviews:
  review_status: false
  commit_status: false

  auto_review:
    enabled: false
    auto_incremental_review: false
    drafts: false
    base_branches:
      - ".*"

  path_filters:
    - "**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/node_modules/**"
    - "!**/.vitepress/cache/**"
    - "!**/.vitepress/dist/**"
    - "!**/TestData/**/*.{csv,json}"
    - "!**/*.g.cs"
    - "!**/*-lock.json"
    - "!**/packages.lock.json"
    - "!**/*.{bak,docx,pptx,xlsx,zip}"

  path_instructions:
    - path: "src/**/*.cs"
      instructions: |
        Apply the nearest AGENTS.md and review for numerical correctness, deterministic warmup, validation, and public API compatibility. Series is the canonical implementation; BufferList and StreamHub results must match it exactly. Flag avoidable allocations or repeated enumeration on calculation paths, nullable internal numeric state, non-propagating NaN handling, epsilon comparisons, and public members without accurate XML documentation. Do not recommend changing a public name, signature, or default without an Obsolete migration shim and explicit approval.

    - path: "src/Indicators/**/*.Series.cs"
      instructions: |
        Require a single-pass implementation unless the mathematics prevents it. Verify formulas and convergence behavior against the authoritative reference cited by the change, not another library implementation. Confirm result count and timestamps match the input and warmup nulls are deterministic.

    - path: "src/Indicators/**/*List.cs"
      instructions: |
        Confirm incremental results match Series exactly, MaxListSize pruning preserves calculation state, and chainable indicators implement the correct increment interface. Flag full-history recomputation and unbounded working buffers.

    - path: "src/Indicators/**/*Hub.cs"
      instructions: |
        Confirm per-tick work is constant-time where the algorithm permits, results match Series exactly, and rebuilds restore all state outside the result cache. Flag direct cache mutation, missed rollback state, or behavior that breaks observer chaining.

    - path: "src/Indicators/**/*.Catalog.cs"
      instructions: |
        Check that parameters, defaults, constraints, result names, chart panes, and To{Name}, To{Name}List, and To{Name}Hub methods match the implementation. Exactly one result may set isReusable: true when its result type exposes IReusable.Value. Verify the listing is registered and intentional shape changes update the catalog snapshot and metrics tests.

    - path: "tests/**/*.cs"
      instructions: |
        Apply tests/AGENTS.md and the repository testing conventions. Require meaningful boundary, validation, warmup, and bad-data coverage. Indicator tests compare Series with approved regression fixtures and verify BufferList and StreamHub convergence; do not request duplicated tests or hand-calculated expectations when the authoritative fixture already covers the behavior. Flag weakened assertions, skipped tests, or baseline changes without corresponding implementation evidence.

    - path: "tools/performance/**/*.cs"
      instructions: |
        Check BenchmarkDotNet setup, representative inputs, allocation measurements, and parity across Series, BufferList, and StreamHub styles. Flag benchmarks whose setup work leaks into the measured operation or whose baseline does not answer the stated performance question.

    - path: "docs/indicators/**/*.md"
      instructions: |
        Apply docs/AGENTS.md and verify the page matches the current To{Name} API, parameters and defaults, historical-bar requirements, warmup and convergence behavior, result properties, chaining support, and StreamHub and BufferList availability. Require sidebar and index registration only for a new page. Do not request behavior or examples that the implementation does not provide.

    - path: "docs/**/*.{md,mdx}"
      instructions: |
        Check technical accuracy, accessible structure and image text, valid links, and VitePress-compatible syntax. Keep prose in present tense and flag claims that conflict with code or nearer AGENTS.md guidance.

    - path: "docs/**/*.{html,vue,mts,ts,js,css,scss}"
      instructions: |
        Apply docs/AGENTS.md. Review accessibility, responsive behavior, VitePress and Vue conventions, build-time rendering, and client-side performance. Preserve the agent-artifact, route, and Cloudflare middleware contracts when related files change.

    - path: ".github/**/*.{yml,yaml}"
      instructions: |
        Apply .github/AGENTS.md. Check least-privilege permissions, pinned action references, untrusted pull-request input, secret handling, concurrency, caching, and parity with the repository's documented quality gates.

    - path: "**/*.{csproj,props,targets,sln,slnx}"
      instructions: |
        Check target-framework and central package consistency, analyzer enforcement, trimming and AOT compatibility, project references, and NuGet packaging metadata. The library must continue to target net10.0, net9.0, and net8.0 with warnings treated as errors in CI.

  tools:
    actionlint:
      enabled: true
    eslint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    osvScanner:
      enabled: true
    semgrep:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true

chat:
  art: false
  auto_reply: true
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  mcp:
    usage: auto
  jira:
    usage: disabled
  linear:
    usage: disabled
